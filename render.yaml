services:
  - type: web
    name: starlight-chronicle
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: starlight-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STARLIGHT_DATA_FILE
        value: /var/data/starlight.sqlite
